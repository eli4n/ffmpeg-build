name: Release

# One release per tag, built exactly once. Push a tag named after the FFmpeg
# version (9.0.2), or run this workflow by hand with that version. A tag with a
# suffix (9.0.2-r2) rebuilds the same FFmpeg version after a change to the
# build recipe. If a release for the tag already exists, nothing is built.
on:
  push:
    tags: ['*']
  workflow_dispatch:
    inputs:
      version:
        description: 'FFmpeg version, e.g. 9.0.2 (or 9.0.2-r2 to rebuild with a changed recipe)'
        required: true

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.version || github.ref_name }}
  cancel-in-progress: false

env:
  # Every third-party image is pinned by digest.
  ALPINE: alpine:3.24@sha256:294b683cb724975bec92580e1e685676bd4b50bda910ddb8c51d4cabeaec77e6
  DEBIAN: debian:stable-slim@sha256:eb593cf2c358cacef45ca0a424bbc7d30cfa3466265fc2662b9466a0ca6ba1c5

jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.plan.outputs.tag }}
      version: ${{ steps.plan.outputs.version }}
      build: ${{ steps.plan.outputs.build }}
    steps:
      - id: plan
        env:
          TAG: ${{ inputs.version || github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ ! "$TAG" =~ ^([0-9]+\.[0-9]+(\.[0-9]+)?)(-r[0-9]+)?$ ]]; then
            echo "::error::'$TAG' is not a release name like 9.0.2 or 9.0.2-r2"
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::notice::Release $TAG exists already, nothing to build."
            echo "build=false" >> "$GITHUB_OUTPUT"
          else
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi

  # Downloaded and verified once; every build job uses these exact files.
  sources:
    needs: plan
    if: needs.plan.outputs.build == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: ./fetch-sources.sh "${{ needs.plan.outputs.version }}" sources
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sources
          path: sources/
          if-no-files-found: error
          # Only needed until the release job has run
          retention-days: 1

  linux:
    needs: [plan, sources]
    strategy:
      fail-fast: false
      matrix:
        variant: [slim, full]
        target: [linux-x64, linux-arm64, linux-x86, linux-armv7, windows-x64, windows-x86]
        include:
          - { target: linux-x64, runner: ubuntu-24.04, platform: linux/amd64 }
          - { target: linux-arm64, runner: ubuntu-24.04-arm, platform: linux/arm64 }
          - { target: linux-x86, runner: ubuntu-24.04, platform: linux/386 }
          # The arm64 runners (Neoverse N2) execute 32-bit ARM natively, so no
          # target needs emulation.
          - { target: linux-armv7, runner: ubuntu-24.04-arm, platform: linux/arm/v7 }
          - { target: windows-x64, runner: ubuntu-24.04, platform: linux/amd64, packages: mingw-w64-gcc }
          - { target: windows-x86, runner: ubuntu-24.04, platform: linux/amd64, packages: i686-mingw-w64-gcc }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sources
          path: sources
      - name: Build
        run: |
          docker run --rm --platform ${{ matrix.platform }} \
            -v "$PWD:/repo:ro" -v "$PWD/sources:/src:ro" -v "$PWD/out:/out" \
            "$ALPINE" sh -c 'apk add --no-cache -q bash build-base nasm xz ${{ matrix.packages }} &&
              /repo/build.sh /src ${{ matrix.variant }} ${{ matrix.target }} /out'
      # On a different libc than the build container, which shows the binary
      # depends on nothing.
      - name: Test
        if: startsWith(matrix.target, 'linux-')
        run: |
          docker run --rm --platform ${{ matrix.platform }} -v "$PWD:/repo:ro" \
            "$DEBIAN" bash /repo/test.sh /repo/out ${{ matrix.variant }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bin-${{ matrix.variant }}-${{ matrix.target }}
          path: out/
          if-no-files-found: error
          # Only needed until the release job has run
          retention-days: 1

  windows-test:
    needs: linux
    strategy:
      fail-fast: false
      matrix:
        variant: [slim, full]
        target: [windows-x64, windows-x86]
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: bin-${{ matrix.variant }}-${{ matrix.target }}
          path: out
      - shell: bash
        run: ./test.sh out ${{ matrix.variant }}

  macos:
    needs: [plan, sources]
    strategy:
      fail-fast: false
      matrix:
        variant: [slim, full]
        target: [darwin-arm64, darwin-x64]
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sources
          path: sources
      - name: Build
        run: |
          # x86 assembly for the Intel build
          if [ "${{ matrix.target }}" = darwin-x64 ]; then brew install nasm; fi
          ./build.sh sources ${{ matrix.variant }} ${{ matrix.target }} out
      - name: Test
        run: |
          if [ "${{ matrix.target }}" = darwin-x64 ]; then
            # Runs the Intel binaries under Rosetta 2
            sudo softwareupdate --install-rosetta --agree-to-license >/dev/null
            arch -x86_64 /bin/bash ./test.sh out ${{ matrix.variant }}
          else
            ./test.sh out ${{ matrix.variant }}
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bin-${{ matrix.variant }}-${{ matrix.target }}
          path: out/
          if-no-files-found: error
          # Only needed until the release job has run
          retention-days: 1

  release:
    needs: [plan, linux, windows-test, macos]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts
      - name: Package
        run: ./package.sh artifacts dist "${{ needs.plan.outputs.tag }}"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: dist/attest-subjects.txt
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.plan.outputs.tag }}
        run: |
          # A draft first: the release only becomes visible once every asset is
          # attached, and is never published half-uploaded.
          gh release create "$TAG" dist/release/* --draft --target "$GITHUB_SHA" \
            --title "FFmpeg $TAG" --notes-file dist/NOTES.md
          gh release edit "$TAG" --draft=false
